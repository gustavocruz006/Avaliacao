{% extends 'base.html' %}

{% block content %}
    <h3>Editar Produto #{{ produto.id }}</h3>

    <form action="/editar/{{ produto.id }}" method="POST" enctype="multipart/form-data">
        <input type="text" name="nome" value="{{ produto.nome }}" placeholder="Nome do produto">
        <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" placeholder="Preço">

        <select name="categoria_id">
            {% for c in categorias %}
                <option value="{{ c.id }}" {% if c.id == produto.categoria_id %}selected{% endif %}>
                    {{ c.nome }}
                </option>
            {% endfor %}
        </select>

        <p>Foto atual:</p>
        <img src="{{ url_for('static', filename='uploads/' + produto.imagem) }}" alt="{{ produto.nome }}">
        <br><br>

        <label>Trocar foto (opcional):</label>
        <input type="file" name="imagem" accept=".png,.jpg,.jpeg,.gif,.webp">
        <br><br>

        <button type="submit">Salvar Alterações</button>
        <a href="/">Cancelar</a>
    </form>
{% endblock %}
